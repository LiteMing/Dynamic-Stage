plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

base { archivesName = "${rootProject.artifact_name}-fabric" }

loom {
    splitEnvironmentSourceSets()
    mods {
        dynamicstage {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

def localVoxyDirectory = rootProject.file("../voxy-thirdparty-java17/build")
def localVoxyDevJar = new File(localVoxyDirectory,
        "devlibs/voxy-${rootProject.voxy_modrinth_version}-HDRS-${rootProject.voxy_hdrs_version}-dev.jar")
def localNamedSodium = fileTree(new File(localVoxyDirectory, "loom-cache/remapped_working")) {
    include "*maven.modrinth-sodium-mc1.20.1-0.5.13-fabric.jar"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    if (providers.gradleProperty("includeVoxy").orNull == "true") {
        if (localVoxyDevJar.isFile()) {
            // Voxy's dev jar is already in Loom's named namespace. Loading it
            // directly avoids asking this older Loom version to remap it again.
            runtimeOnly files(localVoxyDevJar)
            runtimeOnly fileTree(new File(localVoxyDirectory, "processIncludeJars")) {
                include "*.jar"
            }
            runtimeOnly localNamedSodium
        } else {
            modRuntimeOnly "maven.modrinth:voxy:${rootProject.voxy_modrinth_version}"
            modRuntimeOnly "maven.modrinth:sodium:mc1.20.1-0.5.13-fabric"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "modName", rootProject.mod_name
    filesMatching("fabric.mod.json") { expand "version": project.version }
    filesMatching("pack.mcmeta") { expand "mod_name": rootProject.mod_name }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
