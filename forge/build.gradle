plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

base { archivesName = "${rootProject.artifact_name}-forge" }

def requestedRunTasks = gradle.startParameter.taskNames.collect { it.tokenize(":").last() }
// The ordinary Forge client is the shader-compatibility profile. Keep the
// DH-only profile available for isolating renderer behaviour without Oculus.
def forgeOculusRun = requestedRunTasks.any { it == "runClient" || it == "runOculusClient" }
def forgeDhRun = requestedRunTasks.any { it == "runClient" || it == "runDhClient" } || forgeOculusRun
def forgeVoxyRun = requestedRunTasks.any {
    it == "runVoxyClient" || it == "prepareNamedConnector"
}
def localVoxyJar = rootProject.file(
        "../voxy-thirdparty-java17/build/libs/voxy-${rootProject.voxy_modrinth_version}.jar")
def connectorVersion = rootProject.connector_modrinth_version
def connectorNestedPath = "META-INF/jarjar/Connector-${connectorVersion}-mod.jar"
def oculusJar = layout.buildDirectory.file(
        "development-libs/oculus-${rootProject.oculus_modrinth_version}.jar")
def connectorRunJar = layout.buildDirectory.file(
        "connector-runtime/Connector-${connectorVersion}-named.jar")

def oculusSha1 = { File file ->
    def digest = java.security.MessageDigest.getInstance("SHA-1")
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}
def downloadOculus = { File target ->
    target.parentFile.mkdirs()
    target.delete()
    URI downloadUri = new URI(rootProject.oculus_modrinth_download_url)
    String proxyValue = System.getenv("HTTPS_PROXY") ?: System.getenv("https_proxy") ?: System.getenv("HTTP_PROXY") ?: System.getenv("http_proxy")
    URLConnection connection
    if (proxyValue) {
        URI proxyUri = new URI(proxyValue)
        if (proxyUri.host && proxyUri.port > 0) {
            connection = downloadUri.toURL().openConnection(new Proxy(
                    Proxy.Type.HTTP, new InetSocketAddress(proxyUri.host, proxyUri.port)))
        } else {
            connection = downloadUri.toURL().openConnection()
        }
    } else {
        connection = downloadUri.toURL().openConnection()
    }
    connection.connectTimeout = 30_000
    connection.readTimeout = 60_000
    connection.getInputStream().withCloseable { input ->
        target.withOutputStream { output -> input.transferTo(output) }
    }
    String actual = oculusSha1(target)
    if (actual != rootProject.oculus_modrinth_sha1.toLowerCase(Locale.ROOT)) {
        target.delete()
        throw new GradleException("Oculus download failed SHA-1 verification: ${actual}")
    }
}
if (forgeOculusRun) {
    File target = oculusJar.get().asFile
    if (!target.isFile() || oculusSha1(target) != rootProject.oculus_modrinth_sha1.toLowerCase(Locale.ROOT)) {
        logger.lifecycle("Preparing Oculus ${rootProject.oculus_modrinth_version} for the Forge development client")
        downloadOculus(target)
    }
}
if (forgeDhRun && forgeVoxyRun) {
    throw new GradleException("DH and Voxy development clients must be launched separately")
}

loom {
    mods {
        dynamicstage { sourceSet sourceSets.main }
    }
    runs {
        dhClient {
            inherit(getByName("client"))
            name("Forge DH Client")
            ideConfigGenerated(false)
            client()
        }
        voxyClient {
            inherit(getByName("client"))
            name("Forge Voxy Client")
            ideConfigGenerated(false)
            client()
        }
        oculusClient {
            inherit(getByName("client"))
            name("Forge DH + Oculus Client")
            ideConfigGenerated(false)
            client()
        }
    }
}

sourceSets {
    main {
        java.srcDir "src/client/java"
        resources.srcDir "src/client/resources"
    }
}

configurations {
    common
    shadowCommon
    connectorFabricMods {
        canBeConsumed = false
        transitive = false
    }
    connectorSource {
        canBeConsumed = false
        transitive = false
    }
    connectorRemapper {
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()

    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Resolve exactly one LOD renderer for an invoked development client.
    if (forgeDhRun) {
        modRuntimeOnly "maven.modrinth:distanthorizons:FWGxbEM3"
    }
    if (forgeOculusRun) {
        modRuntimeOnly "maven.modrinth:embeddium:UTbfe5d1"
        // Oculus publishes a filename that does not match its Maven module.
        // Inject the verified official CDN artifact into the dev runtime.
        modRuntimeOnly files(oculusJar)
        runtimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"
        forgeRuntimeLibrary "org.anarres:jcpp:1.4.14"
    }
    if (forgeVoxyRun) {
        // Connector is an early ModLauncher service. Voxy must remain in its
        // original intermediary mappings so Connector can transform it.
        forgeRuntimeLibrary files(connectorRunJar)
        modRuntimeOnly("dev.su5ed.sinytra.fabric-api:fabric-api:0.92.6+1.11.14+1.20.1") {
            // Connector supplies the Fabric Loader bridge. Loom also strips
            // nested JarJar metadata while remapping MixinExtras.
            exclude group: "dev.su5ed.sinytra", module: "fabric-loader"
            exclude group: "io.github.llamalad7", module: "mixinextras-forge"
        }
        runtimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"
        connectorFabricMods localVoxyJar.isFile()
                ? files(localVoxyJar)
                : "maven.modrinth:voxy:${rootProject.voxy_modrinth_version}"
        connectorSource "org.sinytra:Connector:${connectorVersion}"
        connectorRemapper "net.fabricmc:tiny-remapper:0.10.3"
        modRuntimeOnly "maven.modrinth:embeddium:UTbfe5d1"
    }

    // CMDCam is part of the Forge development environment because stage-flight
    // authoring and import cannot be exercised without its client commands.
    // Runtime-only dependencies are not bundled into Dynamic Stage's release jar.
    if (forgeDhRun || forgeVoxyRun) {
        modRuntimeOnly "maven.modrinth:cmdcam:as7nPEt0"
        modRuntimeOnly "maven.modrinth:creativecore:m9VEcxwz"
    }
}

if (forgeOculusRun) {
    def resolveOculus = tasks.register("resolveOculusRuntime") {
        group = "dynamic stage"
        description = "Downloads and verifies the Oculus development runtime."
        inputs.property "version", rootProject.oculus_modrinth_version
        inputs.property "sha1", rootProject.oculus_modrinth_sha1
        outputs.file oculusJar

        doLast {
            File target = oculusJar.get().asFile
            String expected = rootProject.oculus_modrinth_sha1.toLowerCase(Locale.ROOT)
            def sha1 = { File file ->
                def digest = java.security.MessageDigest.getInstance("SHA-1")
                file.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    int read
                    while ((read = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, read)
                    }
                }
                digest.digest().collect { String.format("%02x", it & 0xff) }.join()
            }

            if (target.isFile() && sha1(target) == expected) {
                return
            }

            downloadOculus(target)
        }
    }

    tasks.matching { it.name == "runClient" || it.name == "runOculusClient" }.configureEach {
        dependsOn resolveOculus
    }
    tasks.matching { it.name == "generateRemapClasspath" }.configureEach {
        dependsOn resolveOculus
    }
}

if (forgeVoxyRun) {
    def prepareNamedConnector = tasks.register("prepareNamedConnector") {
        group = "dynamic stage"
        description = "Remaps Connector and its embedded Forge mod for Loom's named runtime."
        inputs.files(configurations.connectorSource)
        inputs.property("minecraftVersion", rootProject.minecraft_version)
        inputs.property("forgeVersion", rootProject.forge_version)
        outputs.file(connectorRunJar)

        doLast {
            File mappings = loom.mappingConfiguration.tinyMappingsWithSrg.toFile()
            File srgMinecraft = new File(gradle.gradleUserHomeDir,
                    "caches/fabric-loom/${rootProject.minecraft_version}/forge/" +
                            "${rootProject.forge_version}/minecraft-merged-srg-at-patched.jar")
            if (!mappings.isFile() || !srgMinecraft.isFile()) {
                throw new GradleException("Loom has not prepared the SRG-to-named runtime inputs")
            }

            File source = configurations.connectorSource.singleFile
            File output = connectorRunJar.get().asFile
            File workDirectory = layout.buildDirectory.dir("tmp/prepareNamedConnector").get().asFile
            File remappedOuter = new File(workDirectory, "connector-outer.jar")
            File nestedSource = new File(workDirectory, "connector-mod-srg.jar")
            File nestedRemapped = new File(workDirectory, "connector-mod-named.jar")
            workDirectory.mkdirs()
            [remappedOuter, nestedSource, nestedRemapped, output].each { it.delete() }

            def remap = { File input, File remapped ->
                javaexec {
                    classpath = configurations.connectorRemapper
                    mainClass = "net.fabricmc.tinyremapper.Main"
                    args input.absolutePath, remapped.absolutePath, mappings.absolutePath,
                            "srg", "named", srgMinecraft.absolutePath,
                            "--mixin", "--ignoreConflicts", "--fixPackageAccess"
                }
            }
            remap(source, remappedOuter)

            new java.util.zip.ZipFile(source).withCloseable { sourceZip ->
                java.util.zip.ZipEntry nestedEntry = sourceZip.getEntry(connectorNestedPath)
                if (nestedEntry == null) {
                    throw new GradleException("Connector does not contain ${connectorNestedPath}")
                }
                nestedSource.withOutputStream { destination ->
                    sourceZip.getInputStream(nestedEntry).withCloseable {
                        it.transferTo(destination)
                    }
                }
            }
            remap(nestedSource, nestedRemapped)

            output.parentFile.mkdirs()
            new java.util.zip.ZipFile(remappedOuter).withCloseable { outerZip ->
                new java.util.zip.ZipOutputStream(new java.io.BufferedOutputStream(
                        new java.io.FileOutputStream(output))).withCloseable { outputZip ->
                    outerZip.entries().each { entry ->
                        java.util.zip.ZipEntry replacement = new java.util.zip.ZipEntry(entry.name)
                        replacement.time = entry.time
                        outputZip.putNextEntry(replacement)
                        if (entry.name == connectorNestedPath) {
                            nestedRemapped.withInputStream { it.transferTo(outputZip) }
                        } else if (!entry.directory) {
                            outerZip.getInputStream(entry).withCloseable {
                                it.transferTo(outputZip)
                            }
                        }
                        outputZip.closeEntry()
                    }
                }
            }
        }
    }

    tasks.matching {
        it.name == "generateDLIConfig" || it.name == "runVoxyClient"
    }.configureEach {
        dependsOn prepareNamedConnector
    }

    // Connector needs an unpatched SRG Minecraft jar to transform Fabric mods.
    // Loom creates the ForgeGradle-equivalent clean artifact in its cache.
    def cleanSrgMinecraft = new File(gradle.gradleUserHomeDir,
            "caches/fabric-loom/${rootProject.minecraft_version}/forge/" +
                    "${rootProject.forge_version}/minecraft-merged-srg.jar")
    loom.runs.named("voxyClient") {
        property "connector.clean.path", cleanSrgMinecraft.absolutePath
        // Loom claims ordinary runtime classpath entries before Connector can
        // discover them, so pass the original Fabric jar through its explicit
        // development-mod location instead.
        property "connector.additionalModLocations",
                configurations.connectorFabricMods.singleFile.absolutePath
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "modName", rootProject.mod_name
    filesMatching("META-INF/mods.toml") { expand "version": project.version }
    filesMatching("pack.mcmeta") { expand "mod_name": rootProject.mod_name }
}

jar {
    manifest {
        attributes "MixinConfigs": "dynamicstage.mixins.json,dynamicstage.client.mixins.json"
    }
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    manifest {
        attributes "MixinConfigs": "dynamicstage.mixins.json,dynamicstage.client.mixins.json"
    }
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
