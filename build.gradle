buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven {
        url = 'https://maven.sighs.cc/repository/maven-releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Voxy LOD import (VoxyFileProvider): RocksDB read + Zstd decompression.
    // Plain libraries, NOT mods: plain `implementation` (no fg.deobf).
    implementation "org.rocksdb:rocksdbjni:${rocksdb_version}"
    implementation "com.github.luben:zstd-jni:${zstd_version}"

    // Distant Horizons LOD import (DHFileReader): SQLite read + LZMA2 (XZ) decompression.
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'org.tukaani:xz:1.9'

    // CMDCam (runtime, runClient testing only): live backdrop camera linkage.
    runtimeOnly fg.deobf('maven.modrinth:cmdcam:as7nPEt0')
    runtimeOnly fg.deobf('maven.modrinth:creativecore:m9VEcxwz')

    // Performance mods for runClient testing (Embeddium = Sodium's Forge port;
    // LightSpeedRe = fast resource reload). Runtime-only, not required to run.
    runtimeOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1')
    runtimeOnly fg.deobf('maven.modrinth:lightspeedre:NKQ15PnX')

    // Distant Horizons: NOT declared here — the Modrinth maven doesn't serve its
    // jars; drop the DH jar into run/mods/ manually (see run/mods/README).

    // Unit tests (pure Java codecs, no MC runtime needed)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.rocksdb:rocksdbjni:${rocksdb_version}"
    testImplementation "com.github.luben:zstd-jni:${zstd_version}"
    testImplementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    testImplementation 'org.tukaani:xz:1.9'
}

test {
    useJUnitPlatform()
    if (project.hasProperty('voxyProbe')) {
        systemProperty 'voxy.probe', project.property('voxyProbe')
    }
}

// Plain-main probe for the direct Voxy read path (bypasses JUnit discovery).
// usage: gradlew voxyProbe -PvoxyProbe=<storageDir>
tasks.register('voxyProbe', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vibe.liteming.dynamicstage.bake.voxy.VoxyDirectProbe'
    if (project.hasProperty('voxyProbe')) {
        args project.property('voxyProbe')
    }
}

// Plain-main probe for the DH read path.
// usage: gradlew dhProbe -PdhProbe=<path-to-DistantHorizons.sqlite>
tasks.register('dhProbe', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'vibe.liteming.dynamicstage.bake.dh.DHProbe'
    if (project.hasProperty('dhProbe')) {
        args project.property('dhProbe')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-AreobfSrgFile=${tasks.createMcpToSrg.output.get().asFile}" << "-AoutSrgFile=${buildDir}/tmp/mixin.refmap.srg" << "-AoutRefMapFile=${buildDir}/tmp/mixin/mixins.refmap.json"
}

// FG6 dev runs launch through cpw.mods.bootstraplauncher, which builds its own
// classloader from -DlegacyClassPath.file (minecraftClasspath.txt). Plain
// implementation deps are IGNORED by bootstraplauncher; append the native
// libraries so they land in the legacy classpath at runtime.
tasks.withType(net.minecraftforge.gradle.common.util.runs.MinecraftRunTask).configureEach {
    minecraftArtifacts.from(configurations.runtimeClasspath.files.findAll {
        it.name.contains('rocksdbjni') || it.name.contains('zstd-jni')
                || it.name.contains('sqlite-jdbc') || it.name.contains('xz')
    })
}
